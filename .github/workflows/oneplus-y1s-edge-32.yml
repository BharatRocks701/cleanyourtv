name: OnePlus Y1S Edge 32 - Optimized Launcher APK

on:
  push:
    branches:
      - tv/oneplus-y1s-edge-32-optimized
    paths:
      - launcher/**
      - .github/workflows/oneplus-y1s-edge-32.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package 1366x768 launcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify compact release artifact
        run: |
          test -f launcher/app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "APK: $bytes bytes"
          test "$bytes" -lt 589824
      - name: Downloadable OnePlus APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-OnePlus-Y1S-Edge-32-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
